<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </radialGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="256" r="256" fill="url(#bg)"/>

  <!-- Crossbones behind skull -->
  <g stroke="#e0e0e0" stroke-width="22" stroke-linecap="round" fill="none">
    <line x1="100" y1="340" x2="412" y2="440"/>
    <line x1="412" y1="340" x2="100" y2="440"/>
    <!-- Bone ends -->
    <circle cx="90" cy="335" r="16" fill="#e0e0e0" stroke="none"/>
    <circle cx="105" cy="345" r="16" fill="#e0e0e0" stroke="none"/>
    <circle cx="422" cy="335" r="16" fill="#e0e0e0" stroke="none"/>
    <circle cx="407" cy="345" r="16" fill="#e0e0e0" stroke="none"/>
    <circle cx="90" cy="445" r="16" fill="#e0e0e0" stroke="none"/>
    <circle cx="105" cy="435" r="16" fill="#e0e0e0" stroke="none"/>
    <circle cx="422" cy="445" r="16" fill="#e0e0e0" stroke="none"/>
    <circle cx="407" cy="435" r="16" fill="#e0e0e0" stroke="none"/>
  </g>

  <!-- Skull -->
  <ellipse cx="256" cy="240" rx="120" ry="130" fill="#e0e0e0"/>

  <!-- Afro hair -->
  <ellipse cx="256" cy="150" rx="145" ry="110" fill="#1a1a1a"/>
  <circle cx="140" cy="180" r="50" fill="#1a1a1a"/>
  <circle cx="372" cy="180" r="50" fill="#1a1a1a"/>
  <circle cx="160" cy="130" r="45" fill="#1a1a1a"/>
  <circle cx="352" cy="130" r="45" fill="#1a1a1a"/>
  <circle cx="256" cy="80" r="55" fill="#1a1a1a"/>
  <circle cx="200" cy="90" r="45" fill="#1a1a1a"/>
  <circle cx="312" cy="90" r="45" fill="#1a1a1a"/>

  <!-- Eye sockets -->
  <ellipse cx="210" cy="230" rx="30" ry="35" fill="#0a0a0a"/>
  <ellipse cx="302" cy="230" rx="30" ry="35" fill="#0a0a0a"/>

  <!-- Nose -->
  <ellipse cx="250" cy="280" rx="8" ry="12" fill="#0a0a0a"/>
  <ellipse cx="268" cy="280" rx="8" ry="12" fill="#0a0a0a"/>

  <!-- Grinning teeth -->
  <rect x="200" y="310" width="112" height="30" rx="4" fill="#0a0a0a"/>
  <g fill="#e0e0e0">
    <rect x="206" y="312" width="12" height="26" rx="2"/>
    <rect x="222" y="312" width="12" height="26" rx="2"/>
    <rect x="238" y="312" width="12" height="26" rx="2"/>
    <rect x="254" y="312" width="12" height="26" rx="2"/>
    <rect x="270" y="312" width="12" height="26" rx="2"/>
    <rect x="286" y="312" width="12" height="26" rx="2"/>
  </g>

  <!-- Musical notes floating around -->
  <g fill="#6366f1">
    <!-- Note 1 (top left) -->
    <circle cx="130" cy="100" r="10"/>
    <rect x="138" y="60" width="4" height="42"/>
    <path d="M142,60 Q155,55 148,70" fill="#6366f1"/>

    <!-- Note 2 (top right) -->
    <circle cx="370" cy="85" r="10"/>
    <rect x="378" y="45" width="4" height="42"/>
    <path d="M382,45 Q395,40 388,55" fill="#6366f1"/>

    <!-- Double note (bottom) -->
    <circle cx="350" cy="310" r="9"/>
    <circle cx="380" cy="305" r="9"/>
    <rect x="357" y="270" width="4" height="42"/>
    <rect x="387" y="265" width="4" height="42"/>
    <rect x="357" y="270" width="34" height="5"/>
  </g>
</svg>
